<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zhyar | Personal Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080808;
    --white:#fff;
    --muted:#999;
    --border:rgba(255,255,255,.12);
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    background:#080808;
    color:white;
    font-family:'DM Sans',sans-serif;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:28px 14px 45px;

    overflow-x:hidden;

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

/* =========================
   STARFIELD BACKGROUND
========================= */

.bg-stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
    contain:strict;
    transform:translateZ(0);
}

.bg-stars::before,
.bg-stars::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:200%;
    height:200%;
    pointer-events:none;
    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.bg-stars::before{
    background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 120px 80px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.8px 1.8px at 200px 150px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 320px 40px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.8px 1.8px at 400px 220px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 520px 120px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.8px 1.8px at 640px 300px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 760px 60px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.8px 1.8px at 880px 180px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 1000px 260px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.8px 1.8px at 150px 350px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 280px 480px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.8px 1.8px at 560px 420px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2px 2px at 720px 500px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.8px 1.8px at 920px 380px, rgba(255,255,255,1), transparent 60%);
    background-size:1100px 550px;
    background-repeat:repeat;
    animation:starDrift1 200s linear infinite;
    opacity:.95;
}

.bg-stars::after{
    background-image:
        radial-gradient(3px 3px at 60px 90px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2.5px 2.5px at 240px 200px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(3px 3px at 460px 60px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2.5px 2.5px at 680px 240px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(3px 3px at 900px 100px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2.5px 2.5px at 1080px 300px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(3px 3px at 180px 420px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2.5px 2.5px at 380px 340px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(3px 3px at 820px 460px, rgba(255,255,255,1), transparent 60%),
        radial-gradient(2.5px 2.5px at 1000px 520px, rgba(255,255,255,.95), transparent 60%);
    background-size:1300px 600px;
    background-repeat:repeat;
    animation:starDrift2 260s linear infinite;
    opacity:.85;
}

@keyframes starDrift1{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(-1100px,0,0); }
}

@keyframes starDrift2{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(-1300px,0,0); }
}

/* MAIN */

.container{
    width:100%;
    max-width:470px;
    position:relative;
    z-index:2;
    margin:0 auto;
}

/* =========================
   HERO IMAGE
========================= */

.hero{
    position:relative;

    width:92%;
    aspect-ratio:1 / 1;

    height:auto;

    margin:0 auto;

    overflow:hidden;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.03);

    animation:heroIn .8s ease;

    contain:layout style paint;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.hero img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transform:scale(1.015) translateZ(0);

    filter:
        brightness(.82)
        contrast(1.04)
        saturate(1.04);

    transition:transform 1s ease;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.hero:hover img{
    transform:scale(1.045) translateZ(0);
}

.hero::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.03) 25%,
            rgba(0,0,0,.08) 40%,
            rgba(0,0,0,.78) 100%
        );

    pointer-events:none;
}

.hero::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-90px;
    right:-70px;

    background:rgba(255,255,255,.12);

    filter:blur(55px);

    border-radius:50%;

    z-index:2;
}

/* =========================
   NAME
========================= */

.name{
    position:absolute;

    z-index:5;

    bottom:24px;

    left:0;
    right:0;

    text-align:center;

    font-family:'Anton',sans-serif;

    font-size:clamp(48px, 16vw, 72px);

    line-height:1;

    color:#fff;

    text-transform:uppercase;

    text-shadow:
        0 3px 20px rgba(0,0,0,.75),
        0 0 30px rgba(255,255,255,.12);

    letter-spacing:3px;

    overflow:hidden;
}

.name::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,0,0,.85),
        rgba(0,0,0,.95),
        rgba(0,0,0,.85),
        transparent
    );
    transform:translateX(-250%) skewX(-25deg);
    animation:blackShine 3.2s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:multiply;
    border-radius:4px;
    will-change:transform;
}

@keyframes blackShine{
    0%{
        transform:translateX(-250%) skewX(-25deg);
    }
    60%{
        transform:translateX(420%) skewX(-25deg);
    }
    100%{
        transform:translateX(420%) skewX(-25deg);
    }
}

/* =========================
   LINK CARDS
========================= */

.links{
    margin-top:18px;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.link{
    position:relative;

    width:100%;

    min-height:72px;

    display:flex;

    align-items:center;

    padding:12px 17px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.045)
        );

    border:1px solid var(--border);

    border-radius:21px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    overflow:hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;

    animation:cardIn .6s ease both;

    contain:layout style paint;
    isolation:isolate;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.link:nth-child(1){ animation-delay:.08s; }
.link:nth-child(2){ animation-delay:.14s; }
.link:nth-child(3){ animation-delay:.20s; }
.link:nth-child(4){ animation-delay:.26s; }
.link:nth-child(5){ animation-delay:.32s; }

.link::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.09),
            transparent
        );

    transform:translateX(-150%) skewX(-20deg);

    transition:transform .7s ease;

    will-change:transform;
}

.link:hover::before{
    transform:translateX(280%) skewX(-20deg);
}

.link:hover{
    transform:translateY(-3px) translateZ(0);

    border-color:rgba(255,255,255,.24);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.055)
        );

    box-shadow:
        0 14px 35px rgba(0,0,0,.28);
}

.link-icon{
    width:46px;
    height:46px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    margin-right:13px;

    transition:transform .3s ease, background .3s ease;
}

.link:hover .link-icon{
    transform:scale(1.07) translateZ(0);

    background:rgba(255,255,255,.13);
}

.link-icon i{
    font-size:20px;
}

.link-text{
    flex:1;
    min-width:0;
}

.link-title{
    font-size:15px;

    font-weight:700;

    margin-bottom:3px;
}

.link-sub{
    color:#999;

    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.arrow{
    width:34px;
    height:34px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#aaa;

    background:rgba(255,255,255,.05);

    transition:transform .3s ease, color .3s ease, background .3s ease;
}

.link:hover .arrow{
    color:white;

    transform:translateX(3px) translateZ(0);

    background:rgba(255,255,255,.11);
}

/* =========================
   ACTIVE COLORS
========================= */

.link.active.facebook{
    background:linear-gradient(135deg,rgba(24,119,242,.28),rgba(24,119,242,.12));
    border-color:rgba(24,119,242,.55);
    box-shadow:0 14px 35px rgba(24,119,242,.22);
}
.link.active.facebook .link-icon{
    background:#1877F2;
    border-color:#1877F2;
    box-shadow:0 8px 28px rgba(24,119,242,.45);
}

.link.active.instagram{
    background:linear-gradient(135deg,rgba(131,58,180,.28),rgba(253,29,29,.18),rgba(252,175,69,.16));
    border-color:rgba(225,48,108,.55);
    box-shadow:0 14px 35px rgba(225,48,108,.22);
}
.link.active.instagram .link-icon{
    background:linear-gradient(135deg,#833AB4,#FD1D1D,#FCAF45);
    border-color:transparent;
    box-shadow:0 8px 28px rgba(225,48,108,.42);
}

.link.active.snapchat{
    background:linear-gradient(135deg,rgba(255,252,0,.22),rgba(255,252,0,.09));
    border-color:rgba(255,252,0,.55);
    box-shadow:0 14px 35px rgba(255,252,0,.2);
}
.link.active.snapchat .link-icon{
    background:#FFFC00;
    color:#000;
    border-color:#FFFC00;
    box-shadow:0 8px 28px rgba(255,252,0,.35);
}

.link.active.whatsapp{
    background:linear-gradient(135deg,rgba(37,211,102,.28),rgba(37,211,102,.12));
    border-color:rgba(37,211,102,.55);
    box-shadow:0 14px 35px rgba(37,211,102,.22);
}
.link.active.whatsapp .link-icon{
    background:#25D366;
    border-color:#25D366;
    box-shadow:0 8px 28px rgba(37,211,102,.38);
}

.link.active.tiktok{
    background:linear-gradient(135deg,rgba(0,242,234,.18),rgba(255,0,80,.14));
    border-color:rgba(0,242,234,.55);
    box-shadow:0 14px 35px rgba(0,242,234,.22);
}
.link.active.tiktok .link-icon{
    background:#050505;
    border-color:#00f2ea;
    color:#fff;
    box-shadow:-3px 0 0 rgba(255,0,80,.65),3px 0 0 rgba(0,242,234,.65),0 8px 28px rgba(0,242,234,.22);
}

/* =========================
   WEBSITE / TELEGRAM
========================= */

.bottom{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:13px;
}

.bottom a{
    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    text-decoration:none;

    color:white;

    border-radius:19px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    font-size:13px;

    font-weight:600;

    transition:transform .3s ease, background .3s ease, border-color .3s ease;

    white-space:nowrap;

    contain:layout style paint;
    isolation:isolate;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.bottom a:hover{
    transform:translateY(-3px) translateZ(0);

    background:rgba(255,255,255,.10);

    border-color:rgba(255,255,255,.2);
}

.bottom i{
    font-size:17px;
}

.bottom a.active.website{
    background:linear-gradient(135deg,rgba(120,120,255,.28),rgba(120,120,255,.12));
    border-color:rgba(120,120,255,.55);
    box-shadow:0 14px 35px rgba(120,120,255,.22);
}
.bottom a.active.website i{
    color:#8f8fff;
}

.bottom a.active.telegram{
    background:linear-gradient(135deg,rgba(0,136,204,.28),rgba(0,136,204,.12));
    border-color:rgba(0,136,204,.6);
    box-shadow:0 14px 35px rgba(0,136,204,.28);
}
.bottom a.active.telegram i{
    color:#29b6f6;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:22px;

    color:#666;

    font-size:11px;

    letter-spacing:.5px;

    content-visibility:auto;
    contain-intrinsic-size:50px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   RESPONSIVE — TABLET / iPAD
========================= */

@media (min-width:501px) and (max-width:1024px){

    body{
        padding:40px 24px 60px;
        align-items:center;
    }

    .container{
        max-width:520px;
    }

    .hero{
        width:88%;
        border-radius:32px;
    }

    .name{
        bottom:28px;
        letter-spacing:4px;
    }

    .link{
        min-height:78px;
        padding:14px 20px;
        border-radius:23px;
    }

    .link-icon{
        width:50px;
        height:50px;
        border-radius:16px;
        margin-right:15px;
    }

    .link-icon i{
        font-size:22px;
    }

    .link-title{
        font-size:16px;
    }

    .link-sub{
        font-size:13px;
    }

    .bottom a{
        min-height:64px;
        font-size:14px;
        border-radius:21px;
    }
}

/* =========================
   RESPONSIVE — LARGE SCREENS / DESKTOP
========================= */

@media (min-width:1025px){

    body{
        padding:60px 30px 80px;
        align-items:center;
    }

    .container{
        max-width:560px;
    }

    .hero{
        width:86%;
        border-radius:34px;
    }

    .name{
        bottom:32px;
        letter-spacing:5px;
    }

    .links{
        margin-top:22px;
        gap:14px;
    }

    .link{
        min-height:82px;
        padding:16px 22px;
        border-radius:24px;
    }

    .link-icon{
        width:54px;
        height:54px;
        border-radius:17px;
        margin-right:17px;
    }

    .link-icon i{
        font-size:24px;
    }

    .link-title{
        font-size:17px;
    }

    .link-sub{
        font-size:13px;
    }

    .arrow{
        width:38px;
        height:38px;
    }

    .bottom a{
        min-height:68px;
        font-size:15px;
        border-radius:22px;
    }

    .footer{
        margin-top:28px;
        font-size:12px;
    }
}

/* =========================
   RESPONSIVE — MOBILE
========================= */

@media(max-width:500px){

    body{
        padding:14px 11px 30px;
    }

    .hero{
        width:92%;
        border-radius:26px;
    }

    .name{
        bottom:22px;
        letter-spacing:2px;
    }

    .link{
        min-height:68px;
        border-radius:19px;
    }

    .bottom a{
        min-height:56px;
    }
}

/* =========================
   RESPONSIVE — VERY SMALL PHONES
========================= */

@media(max-width:360px){

    body{
        padding:12px 9px 24px;
    }

    .hero{
        width:94%;
        border-radius:22px;
    }

    .name{
        bottom:18px;
        letter-spacing:1.5px;
    }

    .links{
        margin-top:14px;
        gap:10px;
    }

    .link{
        padding:10px 13px;
        min-height:62px;
        border-radius:17px;
    }

    .link-icon{
        width:40px;
        height:40px;
        margin-right:10px;
        border-radius:13px;
    }

    .link-icon i{
        font-size:17px;
    }

    .link-title{
        font-size:14px;
    }

    .link-sub{
        font-size:11px;
    }

    .arrow{
        width:30px;
        height:30px;
    }

    .arrow i{
        font-size:12px;
    }

    .bottom a{
        min-height:52px;
        font-size:12px;
        border-radius:16px;
    }

    .bottom i{
        font-size:15px;
    }
}

/* =========================
   LANDSCAPE PHONES
========================= */

@media (max-height:500px) and (orientation:landscape){

    body{
        padding:16px 20px 24px;
        align-items:flex-start;
    }

    .hero{
        width:60%;
        max-width:300px;
    }

    .name{
        font-size:clamp(36px, 8vw, 52px);
        bottom:14px;
        letter-spacing:2px;
    }
}

/* ==========================================
   MOBILE PERFORMANCE FIX
========================================== */

@media (max-width:1024px), (hover:none) and (pointer:coarse){

    /* 1. لابردنی backdrop-filter */
    .link,
    .bottom a{
        backdrop-filter:none !important;
        -webkit-backdrop-filter:none !important;
        background:rgba(255,255,255,.07) !important;
    }

    /* 2. لابردنی mix-blend-mode */
    .name::after{
        mix-blend-mode:normal !important;
        background:linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.55),
            rgba(0,0,0,.7),
            rgba(0,0,0,.55),
            transparent
        ) !important;
    }

    /* 3. کەمکردنەوەی blur ی hero::before */
    .hero::before{
        filter:blur(25px) !important;
        opacity:.5 !important;
    }

    /* 4. کەمکردنەوەی box-shadow */
    .hero{
        box-shadow:0 15px 40px rgba(0,0,0,.5) !important;
    }

    /* 5. تەنها یەک layer ی ئەستێرە */
    .bg-stars::after{
        display:none !important;
    }

    .bg-stars::before{
        animation:starDrift1 500s linear infinite !important;
        opacity:.6 !important;
        background-size:900px 450px !important;
    }

    /* 6. لابردنی will-change */
    .link::before,
    .name::after{
        will-change:auto !important;
    }

    /* 7. transition سووکتر */
    .link,
    .bottom a{
        transition:background .2s ease, border-color .2s ease !important;
    }

    /* 8. لابردنی hover effect */
    .link:hover,
    .bottom a:hover{
        transform:none !important;
        box-shadow:none !important;
    }

    .link:hover::before{
        transform:translateX(-150%) skewX(-20deg) !important;
    }

    .link:hover .link-icon{
        transform:none !important;
    }

    .link:hover .arrow{
        transform:none !important;
    }

    /* 9. shine هێواشتر */
    .name::after{
        animation-duration:5s !important;
    }

    /* 10. filter ی سووکتر بۆ وێنە */
    .hero img{
        filter:brightness(.82) !important;
    }
}

/* ==========================================
   FIX — ACTIVE COLOR ON MOBILE
   ڕەنگی پلاتفۆرم لە مۆبایل کار بکات
========================================== */

@media (max-width:1024px), (hover:none) and (pointer:coarse){

    /* Facebook active */
    .link.active.facebook{
        background:linear-gradient(135deg,rgba(24,119,242,.28),rgba(24,119,242,.12)) !important;
        border-color:rgba(24,119,242,.55) !important;
    }
    .link.active.facebook .link-icon{
        background:#1877F2 !important;
        border-color:#1877F2 !important;
