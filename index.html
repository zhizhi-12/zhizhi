<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080808;
    --white:#fff;
    --muted:#999;
    --border:rgba(255,255,255,.12);
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    background:#080808;
    color:white;
    font-family:'DM Sans',sans-serif;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:28px 14px 45px;

    overflow-x:hidden;
}

/* =========================
   STARFIELD BACKGROUND
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    inset:-50%;
    width:200%;
    height:200%;
    pointer-events:none;
    z-index:0;
}

body::before{
    background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.5px 1.5px at 120px 80px, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(1px 1px at 200px 150px, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(1.5px 1.5px at 320px 40px, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(1px 1px at 400px 220px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1.5px 1.5px at 520px 120px, rgba(255,255,255,.65), transparent 60%),
        radial-gradient(1px 1px at 640px 300px, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 760px 60px, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(1px 1px at 880px 180px, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(1.5px 1.5px at 1000px 260px, rgba(255,255,255,.7), transparent 60%);
    background-size:1100px 400px;
    background-repeat:repeat;
    animation:starDrift1 90s linear infinite, twinkle1 4s ease-in-out infinite alternate;
    opacity:.85;
}

body::after{
    background-image:
        radial-gradient(2px 2px at 60px 90px, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(2px 2px at 240px 200px, rgba(255,255,255,.7), transparent 60%),
        radial-gradient(2.5px 2.5px at 460px 60px, rgba(255,255,255,.8), transparent 60%),
        radial-gradient(2px 2px at 680px 240px, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(2.5px 2.5px at 900px 100px, rgba(255,255,255,.85), transparent 60%),
        radial-gradient(2px 2px at 1080px 300px, rgba(255,255,255,.7), transparent 60%);
    background-size:1300px 450px;
    background-repeat:repeat;
    animation:starDrift2 140s linear infinite, twinkle2 6s ease-in-out infinite alternate;
    opacity:.6;
}

@keyframes starDrift1{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(-1100px,0,0); }
}

@keyframes starDrift2{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(-1300px,0,0); }
}

@keyframes twinkle1{
    0%{ opacity:.55; }
    50%{ opacity:.95; }
    100%{ opacity:.65; }
}

@keyframes twinkle2{
    0%{ opacity:.35; }
    50%{ opacity:.8; }
    100%{ opacity:.45; }
}

/* MAIN */

.container{
    width:100%;
    max-width:470px;
    position:relative;
    z-index:2;
    margin:0 auto;
}

/* =========================
   HERO IMAGE
========================= */

.hero{
    position:relative;

    width:92%;
    aspect-ratio:1 / 1;

    height:auto;

    margin:0 auto;

    overflow:hidden;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.03);

    animation:heroIn .8s ease;
}

.hero img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transform:scale(1.015);

    filter:
        brightness(.82)
        contrast(1.04)
        saturate(1.04);

    transition:transform 1s ease;
}

.hero:hover img{
    transform:scale(1.045);
}

.hero::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.03) 25%,
            rgba(0,0,0,.08) 40%,
            rgba(0,0,0,.78) 100%
        );

    pointer-events:none;
}

.hero::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-90px;
    right:-70px;

    background:rgba(255,255,255,.12);

    filter:blur(55px);

    border-radius:50%;

    z-index:2;
}

/* =========================
   NAME
========================= */

.name{
    position:absolute;

    z-index:5;

    bottom:24px;

    left:0;
    right:0;

    text-align:center;

    font-family:'Anton',sans-serif;

    font-size:clamp(48px, 16vw, 72px);

    line-height:1;

    color:#fff;

    text-transform:uppercase;

    text-shadow:
        0 3px 20px rgba(0,0,0,.75),
        0 0 30px rgba(255,255,255,.12);

    letter-spacing:3px;

    overflow:hidden;
}

.name::after{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,0,0,.85),
        rgba(0,0,0,.95),
        rgba(0,0,0,.85),
        transparent
    );
    transform:skewX(-25deg);
    animation:blackShine 3.2s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:multiply;
    border-radius:4px;
}

@keyframes blackShine{
    0%{
        left:-150%;
    }
    60%{
        left:150%;
    }
    100%{
        left:150%;
    }
}

/* =========================
   LINK CARDS
========================= */

.links{
    margin-top:18px;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.link{
    position:relative;

    width:100%;

    min-height:72px;

    display:flex;

    align-items:center;

    padding:12px 17px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.045)
        );

    border:1px solid var(--border);

    border-radius:21px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    overflow:hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;

    animation:cardIn .6s ease both;
}

.link:nth-child(1){ animation-delay:.08s; }
.link:nth-child(2){ animation-delay:.14s; }
.link:nth-child(3){ animation-delay:.20s; }
.link:nth-child(4){ animation-delay:.26s; }
.link:nth-child(5){ animation-delay:.32s; }

.link::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.09),
            transparent
        );

    transform:skewX(-20deg);

    transition:.7s ease;
}

.link:hover::before{
    left:130%;
}

.link:hover{
    transform:translateY(-3px);

    border-color:rgba(255,255,255,.24);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.055)
        );

    box-shadow:
        0 14px 35px rgba(0,0,0,.28);
}

.link-icon{
    width:46px;
    height:46px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    margin-right:13px;

    transition:.3s ease;
}

.link:hover .link-icon{
    transform:scale(1.07);

    background:rgba(255,255,255,.13);
}

.link-icon i{
    font-size:20px;
}

.link-text{
    flex:1;
    min-width:0;
}

.link-title{
    font-size:15px;

    font-weight:700;

    margin-bottom:3px;
}

.link-sub{
    color:#999;

    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.arrow{
    width:34px;
    height:34px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#aaa;

    background:rgba(255,255,255,.05);

    transition:.3s ease;
}

.link:hover .arrow{
    color:white;

    transform:translateX(3px);

    background:rgba(255,255,255,.11);
}

/* =========================
   ACTIVE COLORS
========================= */

.link.active.facebook{

    border-color:rgba(24,119,242,.55);

}
.link.active.facebook .link-icon{

}

.link.active.instagram{

}
.link.active.instagram .link-icon{

.link.active.snapchat{

.link.active.snapchat .link-icon{

}

.link.active.whatsapp{

    border-color:rgba(37,211,102,.55);
    box-shadow:0 14px 35px rgba(37,211,102,.22);
}
.link.active.whatsapp .link-icon{
    background:#25D366;
    border-color:#25D366;

}

.link.active.tiktok{

    border-color:rgba(0,242,234,.55);
    box-shadow:0 14px 35px rgba(0,242,234,.22);
}
.link.active.tiktok .link-icon{
    background:#050505;
    border-color:#00f2ea;
    color:#fff;
    box-shadow:-3px 0 0 rgba(255,0,80,.65),3px 0 0 rgba(0,242,234,.65),0 8px 28px rgba(0,242,234,.22);
}

/* =========================
   WEBSITE / TELEGRAM
========================= */

.bottom{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:13px;
}

.bottom a{
    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    text-decoration:none;

    color:white;

    border-radius:19px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    font-size:13px;

    font-weight:600;

    transition:.3s ease;

    white-space:nowrap;
}

.bottom a:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.10);

    border-color:rgba(255,255,255,.2);
}

.bottom i{
    font-size:17px;
}

.bottom a.active.website{
    background:linear-gradient(135deg,rgba(120,120,255,.28),rgba(120,120,255,.12));
    border-color:rgba(120,120,255,.55);
    box-shadow:0 14px 35px rgba(120,120,255,.22);
}
.bottom a.active.website i{
    color:#8f8fff;
}

.bottom a.active.telegram{
    background:linear-gradient(135deg,rgba(0,136,204,.28),rgba(0,136,204,.12));
    border-color:rgba(0,136,204,.6);
    box-shadow:0 14px 35px rgba(0,136,204,.28);
}
.bottom a.active.telegram i{
    color:#29b6f6;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:22px;

    color:#666;

    font-size:11px;

    letter-spacing:.5px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

<script>

/* ==========================================
   LINK CARDS — ORIGINAL COLOR AFTER CLICK
========================================== */

const linkCards = document.querySelectorAll(".link");

linkCards.forEach(card => {

    card.addEventListener("click", function(){

        linkCards.forEach(item => {
            item.classList.remove("active");
        });

        this.classList.add("active");

    });

});


/* ==========================================
   BOTTOM BUTTONS — ORIGINAL COLOR AFTER CLICK
========================================== */

const bottomButtons =
    document.querySelectorAll(".bottom a");

bottomButtons.forEach(btn => {

    btn.addEventListener("click", function(){

        bottomButtons.forEach(item => {
